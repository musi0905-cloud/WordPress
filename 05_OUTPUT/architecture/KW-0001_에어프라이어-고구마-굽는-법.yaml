section_specifications:
  - section_id: SEC-01
    purpose: 조리 전 손질(세척·물기 제거·구멍 뚫기)의 이유와 방법을 안내
    answers_question: 고구마를 씻고 바로 넣어도 되는지, 물기를 닦아야 하는지
    required_points:
      - 흐르는 물에 표면을 씻고 필요하면 솔로 문지른다
      - 물기를 완전히 제거해야 겉면이 고르게 익고 눅눅해지지 않는다
      - 포크로 2~3군데 찔러 껍질에 구멍을 내면 조리 중 김이 빠져나갈 통로가 생긴다
    evidence_needed: LOW — 일반적인 조리 상식 수준, 별도 수치 검증 불필요
    target_length: 120~180자
  - section_id: SEC-02
    purpose: 예열 필요 여부를 기기별로 정리해 불필요한 단정을 피함
    answers_question: 예열은 꼭 해야 하는지
    required_points:
      - 대부분의 가정용 에어프라이어는 예열 없이도 조리 가능
      - 예열을 지원하는 기기는 예열 시 겉면이 더 고르게 익는 경향
      - 정확한 예열 필요 여부는 제조사 설명서를 우선 따른다
    evidence_needed: LOW
    target_length: 100~150자
  - section_id: SEC-03
    purpose: 크기별 온도·시간 기준표 제시 (핵심 섹션)
    answers_question: 몇 도에서 몇 분 구워야 하는가
    required_points:
      - 온도 기준 약 190~200°C(375~400°F)
      - 작은 고구마(약 150g 이하) 약 25~30분
      - 중간 고구마(약 150~250g) 약 35~45분
      - 큰 고구마(약 250g 이상) 약 45~55분
      - 기기·고구마 굵기에 따라 5~10분 이상 차이날 수 있다는 점을 명시
    evidence_needed: HIGH — 수치 검증 필요, 실제 공개 자료 대조 완료(Source Package 참조)
    table_required: true
    target_length: 250~350자 + 표
  - section_id: SEC-04
    purpose: 뒤집기 필요 여부를 기기 유형별로 구분
    answers_question: 중간에 뒤집어야 하는지
    required_points:
      - 바스켓형(공기 순환 구조)은 대체로 뒤집지 않아도 고르게 익음
      - 트레이(오븐)형이거나 판 위에 올려 굽는 경우 중간에 한 번 뒤집는 것이 좋음
    evidence_needed: MEDIUM
    target_length: 120~180자
  - section_id: SEC-05
    purpose: 완성 확인법을 구체적 동작으로 안내
    answers_question: 다 익었는지 어떻게 확인하는지
    required_points:
      - 꼬치나 젓가락으로 가장 굵은 부분을 찔러 부드럽게 들어가는지 확인
      - 손으로 살짝 눌렀을 때 말랑한 느낌인지 확인
      - 겉면에 캐러멜화된 즙이 배어나오면 잘 익은 신호일 수 있음
    evidence_needed: LOW
    target_length: 120~180자
  - section_id: SEC-06
    purpose: 증상별 실패 원인과 해결법을 구조적으로 제시 (핵심 섹션)
    answers_question: 왜 겉은 탔는데 속은 안 익는지, 왜 덜 익는지, 왜 퍽퍽한지
    required_points:
      - "겉만 타고 속은 안 익음": 온도가 높거나 고구마가 큰데 시간이 짧은 경우 → 온도를 10~15°C 낮추고 시간을 늘리거나, 전자레인지로 3~5분 초벌 후 에어프라이어로 마무리
      - "전체적으로 덜 익음": 시간 부족, 크기 과소평가, 바스켓에 여러 개를 겹쳐 담아 밀집된 경우 → 시간을 늘리고 여유 공간을 두고 다시 확인
      - "퍽퍽함": 크기에 비해 지나치게 오래 조리한 경우 → 크기별 권장 시간을 지키고 다 익으면 바로 꺼낸다
    evidence_needed: HIGH — 실제 공개 트러블슈팅 자료 대조 완료(Source Package 참조)
    target_length: 300~400자
  - section_id: SEC-07
    purpose: 본문에서 다루지 않은 보조 질문에 대한 짧은 답
    faq_items:
      - question: 에어프라이어 고구마는 호일에 싸서 구워야 하나요?
        answer_direction: 필수는 아니며, 감싸지 않아야 겉면이 더 바삭해진다는 점을 안내
      - question: 냉동 고구마도 같은 시간에 구우면 되나요?
        answer_direction: 냉동 상태면 해동 여부에 따라 시간이 더 필요할 수 있다는 점을 안내(정확한 수치는 확인된 자료 부족으로 단정하지 않음)
      - question: 구운 고구마는 얼마나 보관할 수 있나요?
        answer_direction: 일반적인 냉장 보관 상식 수준에서 짧게 안내, 과도한 보존 기간 단정은 피함
    evidence_needed: LOW_TO_MEDIUM
    target_length: 각 60~100자

evidence_plan:
  - claim: "온도 약 190~200°C(375~400°F), 크기별 25~55분 범위"
    source_type: PUBLIC_RECIPE_GUIDE
    verification_status: VERIFIED_VIA_WEB_SEARCH
