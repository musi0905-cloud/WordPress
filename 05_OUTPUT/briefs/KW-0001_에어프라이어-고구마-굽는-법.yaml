information_requirements:
  must_answer:
    - 고구마 크기별(작은/중간/큰) 온도와 시간
    - 뒤집어야 하는지 여부와 그 이유
    - 다 익었는지 확인하는 구체적인 방법
  must_explain:
    - 세척과 물기 제거가 왜 필요한가
    - 예열이 꼭 필요한가
    - 겉만 타고 속이 안 익는 원인
    - 전체적으로 덜 익는 원인
    - 퍽퍽해지는 원인
  must_compare:
    - 작은 고구마 vs 중간 고구마 vs 큰 고구마의 시간 차이
    - 바스켓형 vs 트레이(오븐)형 에어프라이어의 뒤집기 필요 여부
  must_warn:
    - 온도·시간은 기기와 고구마 굵기에 따라 달라질 수 있음을 명시
  optional_information:
    - 다 구운 고구마 보관/재가열 간단 팁
  excluded_information:
    - 검증되지 않은 건강·다이어트 효과 주장
    - 특정 브랜드 에어프라이어에 대한 과장된 비교

reader_questions:
  primary_question: 에어프라이어로 고구마를 몇 도에서 몇 분 구워야 하나요?
  supporting_questions:
    - 고구마를 씻고 바로 넣어도 되나요, 물기를 닦아야 하나요?
    - 예열은 꼭 해야 하나요?
    - 중간에 뒤집어야 하나요?
    - 다 익었는지 어떻게 확인하나요?
    - 왜 겉은 타는데 속은 안 익나요?
    - 고구마가 퍽퍽하게 나오는 이유는 무엇인가요?
  faq_candidates:
    - 에어프라이어 고구마는 호일에 싸서 구워야 하나요?
    - 냉동 고구마도 같은 시간에 구우면 되나요?
    - 구운 고구마는 얼마나 보관할 수 있나요?

