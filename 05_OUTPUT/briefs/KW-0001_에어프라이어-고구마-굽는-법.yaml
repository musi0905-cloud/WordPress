    - 왜 겉은 탔는데 속은 안 익는가
  concerns:
    - 시간을 잘못 맞춰 고구마를 버리게 될까봐 걱정
    - 기기마다 달라서 레시피를 믿기 어려움

content_objective:
  primary_goal: 고구마 크기별 온도·시간 범위와 확인법을 제시해 독자가 바로 실행하게 한다
  reader_value: 크기별 기준표 + 실패 원인별 해결법으로 시행착오를 줄여준다
  completion_condition: 독자가 자기 고구마 크기에 맞는 온도·시간을 선택하고, 실패 시 원인을 스스로 진단할 수 있으면 목적 달성

content_type:
  primary_template: HOW_TO_GUIDE
  secondary_components:
    - COMPARISON_TABLE (크기별 온도·시간표)
    - TROUBLESHOOTING_LIST (실패 원인별 해결법)
    - FAQ
  selection_reason: 검색 의도가 명확한 실행형(KNOW_HOW) 키워드이므로 단계별 가이드 + 표 + 문제해결 조합이 가장 직접적으로 답한다

dna_profile:
  selected_dna_profile: PENDING — WF-02_KNOWLEDGE_ENGINEERING이 아직 실행되지 않아 06_MEMORY/KNOWLEDGE_LIBRARY/CONTENT_DNA.md가 비어 있음(Version 0). Content DNA 압축본 없이, 아래 information_flow/heading_strategy/evidence_strategy/trust_strategy는 이 Brief 수준에서 직접 설계함
  information_flow: 준비(손질) → 예열 여부 → 크기별 온도·시간표 → 뒤집기 여부 → 완성 확인법 → 실패 원인별 해결 → FAQ
  heading_strategy: H2로 준비/온도-시간표/뒤집기/확인법/문제해결/FAQ를 명확히 분리, 표는 H2 "크기별 온도와 시간" 아래 배치
  evidence_strategy: 공개된 여러 조리 가이드의 온도·시간을 상호 대조해 범위로 제시하고, 출처 간 편차를 숨기지 않고 명시
  trust_strategy: 단일 정답이 아니라 범위 + 기기별 편차 인정 + 마지막엔 직접 확인을 권장해 과신 대신 실제 성공률을 높이는 방향으로 신뢰 확보

